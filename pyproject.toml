[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-mcp"
version = "0.1.0"
description = "MCP server for the Etsy Open API v3, generated from Etsy's OpenAPI spec"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["fastmcp-slim[server]>=4.2", "httpx2"]

[project.urls]
Repository = "https://github.com/lutyjj/etsy-mcp"

[project.scripts]
etsy-mcp = "etsy_mcp.server:main"
etsy-mcp-login = "etsy_mcp.login:main"

[tool.setuptools]
packages = ["etsy_mcp"]

[tool.setuptools.package-data]
etsy_mcp = ["etsy-openapi.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# A frozen dataclass of frozensets; sharing the default is safe.
extend-immutable-calls = ["etsy_mcp.config.ToolFilter"]

[tool.mypy]
strict = true
files = ["etsy_mcp", "tests"]

# Tests are typed where it helps; pytest fixtures stay unannotated.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
