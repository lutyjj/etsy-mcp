[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-mcp"
version = "0.1.0"
description = "Etsy Open API v3 MCP server generated from Etsy's OpenAPI spec"
requires-python = ">=3.12"
dependencies = ["fastmcp-slim[server]>=4.2", "httpx2"]

[project.scripts]
etsy-mcp = "etsy_mcp.server:main"
etsy-mcp-login = "etsy_mcp.login:main"

[tool.setuptools]
packages = ["etsy_mcp"]

[tool.setuptools.package-data]
etsy_mcp = ["etsy-openapi.json"]
